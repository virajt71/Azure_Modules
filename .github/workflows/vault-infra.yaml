name: Terraform Deployment
on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    env:
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Credentials from Vault
        uses: hashicorp/vault-action@v3
        env:
          ACTIONS_STEP_DEBUG: true   # ← Add this
        with:
          url: http://134.149.99.23:8200
          role: gh-actions-role
          method: jwt
          secrets: |
            azure/creds/terraform-role client_id | ARM_CLIENT_ID ;
            azure/creds/terraform-role client_secret | ARM_CLIENT_SECRET

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan
      - run: terraform apply -auto-approve
