name: Terraform Deployment - Azure
on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - uses: actions/checkout@v4

      - name: Fetch All Azure Credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: http://20.82.210.227:8200
          role: gh-actions-role
          method: jwt
          exportEnv: true
          secrets: |
            azure/creds/terraform-role  client_id        | ARM_CLIENT_ID ;
            azure/creds/terraform-role  client_secret    | ARM_CLIENT_SECRET ;
            secret/data/azure/config    subscription_id  | ARM_SUBSCRIPTION_ID ;
            secret/data/azure/config    tenant_id        | ARM_TENANT_ID

      - uses: hashicorp/setup-terraform@v3
      - run: terraform init
      - run: terraform plan
      - run: terraform apply -auto-approve
